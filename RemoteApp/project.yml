# Vespertine Remote: the iPhone and iPad app that controls Vespertine on a Mac (Settings › Remote on the Mac).
# Generate with `xcodegen generate --spec RemoteApp/project.yml` from the repository root.
# SPDX-License-Identifier: GPL-3.0-or-later WITH LicenseRef-Vespertine-App-Store-Exception
name: VespertineRemote
options:
  bundleIdPrefix: org.szeremeta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  VespertineRemoteKit:
    path: ../Packages/VespertineRemoteKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VespertineRemote:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: VespertineRemoteKit
        product: VespertineRemoteProtocol
      - package: VespertineRemoteKit
        product: VespertineRemoteClient
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Vespertine Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: "Vespertine Remote finds and controls Vespertine on the Macs on your network."
        NSBonjourServices: ["_vespertine._tcp"]
        NSCameraUsageDescription: "Vespertine Remote uses the camera only to scan the pairing code that Vespertine shows on your Mac."
        # Scanning the Mac's QR code with the Camera app opens Vespertine Remote and pairs.
        CFBundleURLTypes:
          - CFBundleURLName: org.szeremeta.VespertineRemote.pair
            CFBundleURLSchemes: [vespertine-remote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.szeremeta.VespertineRemote
        PRODUCT_NAME: VespertineRemote
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 7WMQ9ZV6V8
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
