<!doctype html>
<!-- Social preview (GitHub, Open Graph, Twitter/X, Mastodon, Slack, iMessage): 1280x640.
     Render with scripts/make-social-preview.sh, which writes site/assets/og.png. -->
<html>
<head>
<meta charset="utf-8">
<style>
  /* Open fonts only (docs/design/fonts): Apple's New York and SF are licensed for interface mock-ups, not artwork. */
  @font-face { font-family: "Newsreader"; font-weight: 300 500; src: url(../../site/assets/fonts/Newsreader.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 400 600; src: url(../../site/assets/fonts/Inter.woff2) format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400 500; src: url(../../site/assets/fonts/JetBrainsMono.woff2) format("woff2"); }
  :root {
    --base: #09090A; --text: #ECE6DA; --text2: #A29B8F; --text3: #69645C;
    --brass: #C8A66A; --brassHi: #E7CD98;
  }
  html, body { margin: 0; background: var(--base); height: 640px; overflow: hidden; }
  .card {
    position: relative; width: 1280px; height: 640px; overflow: hidden;
    background:
      radial-gradient(760px 520px at 80% 46%, rgba(200, 166, 106, 0.17), transparent 64%),
      radial-gradient(700px 500px at 0% 100%, rgba(201, 139, 91, 0.07), transparent 60%),
      var(--base);
    font-family: "Inter", sans-serif; color: var(--text);
  }

  /* Left: name and promise */
  .copy { position: absolute; left: 76px; top: 106px; width: 500px; }
  /* The brand lockup (docs/brand/logo.svg): crescent + "vespertine" in Newsreader Light, outlined. */
  .lockup { display: block; height: 138px; margin: 0 0 0 -34px; } /* the SVG carries clear space; -34 px puts the crescent on the text edge */
  .lede { font-family: "Newsreader", serif; font-size: 32px; line-height: 1.22;
          margin: 14px 0 0; max-width: 470px; }
  .lede em { font-style: normal; }
  .chips { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 9px; width: 470px; }
  .chip {
    font-family: "JetBrains Mono", monospace; font-size: 13px; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--text2); border: 1px solid rgba(236,230,218,.14);
    border-radius: 7px; padding: 6px 10px;
  }
  .foot { position: absolute; left: 76px; bottom: 42px; font-size: 17px; color: var(--text3); }
  .foot b { color: var(--text2); font-weight: 500; }

  /* Right: the app window, with the signal path lifted out of it at a readable size.
     Both are crops of docs/screenshots/bit-perfect-fiio-24-96.png (2400x1500). */
  .window {
    position: absolute; left: 596px; top: 46px; width: 740px; height: 552px; overflow: hidden;
    border-radius: 14px 0 0 14px; box-shadow: 0 0 0 1px rgba(236,230,218,.09), 0 40px 90px rgba(0,0,0,.7);
  }
  .window img { position: absolute; width: 883px; left: -144px; top: 0; filter: brightness(.78); }
  .panel {
    position: absolute; left: 818px; top: 80px; width: 427px; padding: 18px 0 14px;
    background: #0C0C0F; border-radius: 18px;
    box-shadow: 0 0 0 1px rgba(200,166,106,.30), 0 0 60px rgba(200,166,106,.10), 0 44px 90px rgba(0,0,0,.8);
  }
  /* From the title to the volume row: x 1826-2373, y 540-1160 of the screenshot, at 0.78. */
  .crop { position: relative; height: 484px; overflow: hidden; }
  .crop img { position: absolute; width: 1872px; left: -1424px; top: -421px; }
</style>
</head>
<body>
  <div class="card">
    <div class="copy">
      <img class="lockup" src="../brand/logo.svg" alt="vespertine">
      <p class="lede">The free, open-source Mac player for <em>surround and hi-res</em> music collections.</p>
      <div class="chips">
        <span class="chip">SACD rips · DTS CDs</span>
        <span class="chip">Atmos · TrueHD · DTS</span>
        <span class="chip">Spatial Audio</span>
        <span class="chip">Signal path</span>
      </div>
    </div>
    <div class="foot"><b>Open source</b> · GPL-3.0 · macOS 14.4+ · Apple silicon &amp; Intel</div>
    <div class="window"><img src="../screenshots/bit-perfect-fiio-24-96.png" alt=""></div>
    <div class="panel"><div class="crop"><img src="../screenshots/bit-perfect-fiio-24-96.png" alt=""></div></div>
  </div>
</body>
</html>
