name: Vespertine
options:
  bundleIdPrefix: org.szeremeta
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  VespertineKit:
    path: Packages/VespertineKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.6.4"
    CURRENT_PROJECT_VERSION: "31"
    DEAD_CODE_STRIPPING: YES
targets:
  Vespertine:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: VespertineKit
        product: VespertineAudio
      - package: VespertineKit
        product: VespertineLibrary
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleName: $(VESPERTINE_DISPLAY_NAME)
        CFBundleDisplayName: $(VESPERTINE_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 Vespertine contributors. Free software under the GNU GPL v3."
        NSAppleEventsUsageDescription: "Vespertine responds to media keys and Now Playing controls."
        # Sparkle: EdDSA-signed appcast attached to the latest GitHub release.
        SUFeedURL: https://github.com/szeremeta1/Vespertine/releases/latest/download/appcast.xml
        SUPublicEDKey: 5KxX9Zdz/fXEO1SpPUjZWxkNWiIzSMzMXava8UpHeNw=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAllowsAutomaticUpdates: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, org.xiph.flac, com.microsoft.waveform-audio, public.aiff-audio, public.mp3, com.apple.m4a-audio]
    entitlements:
      path: App/Vespertine.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.szeremeta.Vespertine
        PRODUCT_NAME: Vespertine
        VESPERTINE_DISPLAY_NAME: Vespertine
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # Development builds are a separate app: own settings, own library, "Vespertine Dev" in the Dock,
        # so they never collide with (or touch) the installed Vespertine.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: org.szeremeta.Vespertine.dev
          VESPERTINE_DISPLAY_NAME: Vespertine Dev

  VespertineAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [App/Tests]
    dependencies:
      - target: Vespertine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        CODE_SIGN_IDENTITY: "-"
schemes:
  Vespertine:
    build:
      targets:
        Vespertine: all
    test:
      targets: [VespertineAppTests]
      commandLineArguments:
        '-VespertineDataDirectory "/tmp/vespertine-test-host-library"': true
