name: Vespertine
options:
  bundleIdPrefix: org.szeremeta
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  VespertineKit:
    path: Packages/VespertineKit
  VespertineRemoteKit:
    path: Packages/VespertineRemoteKit
  # Pinned: the app's own lockfile lives in the generated (ignored) project, so a fresh clone would otherwise build
  # with whatever Sparkle is newest. Updating it is a deliberate change here.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "73"
    DEAD_CODE_STRIPPING: YES
targets:
  Vespertine:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
      # The license texts travel inside the app (Contents/Resources), as the GPL and the bundled components' licenses ask.
      - path: LICENSE
        buildPhase: resources
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
      # Full license and copyright texts of the bundled components (Contents/Resources/Licenses).
      - path: App/Licenses
        type: folder
        buildPhase: resources
      # Mac Sound Output (beta): the helper's launch agent (SMAppService.agent), kept alive by launchd. Both names travel in
      # both builds; each app registers the one for its own bundle ID.
      - path: Helper/LaunchAgents/org.szeremeta.Vespertine.SoundHelper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      - path: Helper/LaunchAgents/org.szeremeta.Vespertine.SoundHelper.dev.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: VespertineKit
        product: VespertineAudio
      - package: VespertineKit
        product: VespertineLibrary
      - package: VespertineKit
        product: VespertineVisualizer
      - package: VespertineKit
        product: VespertineUPnP
      - package: VespertineKit
        product: VespertineTidal
      - package: VespertineRemoteKit
        product: VespertineRemoteProtocol
      - package: VespertineRemoteKit
        product: VespertineStreamServer
      - package: Sparkle
      # Mac Sound Output (beta): the audio driver travels inside the app (Contents/Library/Audio) and is copied to
      # /Library/Audio/Plug-Ins/HAL only when the user turns the feature on.
      - target: VespertineSound
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Audio
      # Mac Sound Output (beta): the helper that plays published groups with Vespertine closed, a login item registered
      # (SMAppService) only while a group is published.
      - target: VespertineSoundHelper
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
    info:
      path: App/Info.plist
      properties:
        CFBundleName: $(VESPERTINE_DISPLAY_NAME)
        CFBundleDisplayName: $(VESPERTINE_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 Vespertine contributors. Free software under the GNU GPL, version 3 or later."
        # Network shares are probed and mounted over the local network (or a VPN); without this string
        # macOS's Local Network prompt has no explanation, and a denied or unanswered prompt looks like an offline server.
        NSLocalNetworkUsageDescription: "Vespertine connects to the music servers and network shares you add, on your network or over a VPN. If you turn on Remote, the phones and browsers you pair can control it too. If you turn on Network Players, it finds the network players on your network and sends them the music you play."
        # The phone remote (Settings › Remote, off by default) advertises this Mac on Bonjour for the Vespertine Remote app.
        NSBonjourServices: ["_vespertine._tcp"]
        # Room measurement, the loopback self-test and Mac Sound Output. macOS attributes the sound helper's input to
        # this app (it is the helper's responsible process), so this text, not the helper's, is what the prompt shows.
        NSMicrophoneUsageDescription: "Vespertine uses audio input only for what you start: a room measurement records your measurement microphone, the loopback test records a virtual loopback device, and Mac Sound Output receives what your apps play to a speaker group you published, to play it on the group's speakers. Nothing else is recorded."
        # Sparkle: EdDSA-signed appcast attached to the latest GitHub release.
        SUFeedURL: https://github.com/szeremeta1/Vespertine/releases/latest/download/appcast.xml
        SUPublicEDKey: 5KxX9Zdz/fXEO1SpPUjZWxkNWiIzSMzMXava8UpHeNw=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAllowsAutomaticUpdates: true
        # Check the update's EdDSA signature before the archive is even opened, not only before it's installed.
        SUVerifyUpdateBeforeExtraction: true
        # The whole appcast is EdDSA-signed too (generate_appcast signs it once a build carries this key, and keeps
        # signing it after), so a tampered feed is refused. Never edit the uploaded appcast.xml by hand.
        SURequireSignedFeed: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, org.xiph.flac, com.microsoft.waveform-audio, public.aiff-audio, public.mp3, com.apple.m4a-audio]
    entitlements:
      path: App/Vespertine.entitlements
      properties:
        com.apple.security.app-sandbox: false
        # Hardened runtime: the loopback self-test reads a virtual device's input.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.szeremeta.Vespertine
        PRODUCT_NAME: Vespertine
        VESPERTINE_DISPLAY_NAME: Vespertine
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # Development builds are a separate app: own settings, own library, "Vespertine Dev" in the Dock,
        # so they never collide with (or touch) the installed Vespertine.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: org.szeremeta.Vespertine.dev
          VESPERTINE_DISPLAY_NAME: Vespertine Dev

  # Mac Sound Output (beta): the Core Audio driver (an AudioServerPlugIn) that shows published speaker groups as outputs.
  # Plain C, no Swift: it runs inside coreaudiod. See Driver/VespertineSound/VespertineSound.c.
  VespertineSound:
    type: bundle
    platform: macOS
    sources:
      - path: Driver/VespertineSound
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.szeremeta.vespertine.sound
        PRODUCT_NAME: VespertineSound
        WRAPPER_EXTENSION: driver
        INFOPLIST_FILE: Driver/VespertineSound/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GCC_C_LANGUAGE_STANDARD: c11
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        CLANG_ENABLE_OBJC_ARC: NO
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: ["-framework", "CoreAudio", "-framework", "CoreFoundation"]

  # Mac Sound Output (beta): the helper. No window or Dock icon; plays what other apps send a published group's output.
  VespertineSoundHelper:
    type: application
    platform: macOS
    sources:
      - path: Helper/Sources
      - path: Helper/Resources
      # The app's strings: the helper's few are in the same catalog.
      - path: App/Resources/Localizable.xcstrings
    dependencies:
      - package: VespertineKit
        product: VespertineAudio
    info:
      path: Helper/Info.plist
      properties:
        CFBundleName: $(VESPERTINE_HELPER_NAME)
        CFBundleDisplayName: $(VESPERTINE_HELPER_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 Vespertine contributors. Free software under the GNU GPL, version 3 or later."
        # What other apps play reaches the helper as the input of Vespertine's audio driver, which macOS counts as recording.
        NSMicrophoneUsageDescription: "Vespertine Sound Helper receives what your apps play to a speaker group you published as a Mac sound output, and plays it on the group's speakers. It never records a microphone."
    entitlements:
      path: Helper/VespertineSoundHelper.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.szeremeta.Vespertine.SoundHelper
        PRODUCT_NAME: Vespertine Sound Helper
        VESPERTINE_HELPER_NAME: Vespertine Sound Helper
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: org.szeremeta.Vespertine.SoundHelper.dev
          VESPERTINE_HELPER_NAME: Vespertine Dev Sound Helper

  VespertineAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [App/Tests]
    dependencies:
      - target: Vespertine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        CODE_SIGN_IDENTITY: "-"
schemes:
  Vespertine:
    build:
      targets:
        Vespertine: all
    test:
      targets: [VespertineAppTests]
      commandLineArguments:
        '-VespertineDataDirectory "/tmp/vespertine-test-host-library"': true
