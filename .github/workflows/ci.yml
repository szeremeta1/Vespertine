# Builds and tests every pull request to main and every push to main:
# - the analysis core on Linux, where vespertine-analyze runs on servers;
# - the engine and library packages on macOS, and in the same job the real-time C under AddressSanitizer,
#   UndefinedBehaviorSanitizer and ThreadSanitizer, clang's analyzer, and a parse of the release scripts;
# - the app itself (generated with XcodeGen) with its tests, plus a universal Release build;
# - the spec-traced verification (verification/): the requirement registry and oracles, the blind-written checks
#   against their clean-room implementations, mutants and Vespertine, and Vespertine's IEC 61937 carriers against
#   FFmpeg's S/PDIF demuxer and a blind carrier scanner.
# Nothing here signs, notarizes or publishes; tests that need real audio hardware stay opt-in (VESPERTINE_HARDWARE_TESTS).
#
# macOS runner minutes are the expensive ones (about 10x Linux when billed), so:
# - changes only to the website, docs, root Markdown or issue templates don't start CI. THIRD-PARTY-NOTICES.md and
#   LICENSE ship inside the app, so they still do;
# - draft pull requests get the Linux jobs only. The macOS jobs run when the PR is marked ready for review, or on
#   demand (Actions > CI > Run workflow, on the PR's branch);
# - a newer push to the same pull request or branch cancels the run in progress;
# - pull requests restore the SwiftPM caches but only main saves them, so per-PR copies (0.7 to 1.3 GB each) don't
#   push main's out of the repository's 10 GB cache;
# - every job has a timeout of about twice its longest run so far, so a hung test can't hold a runner for an hour.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**'
      - '!site/**'
      - '!docs/**'
      - '!*.md'
      - 'THIRD-PARTY-NOTICES.md'
      - '!.github/ISSUE_TEMPLATE/**'
      - '!.github/workflows/pages.yml'
      - '!scripts/brand/**'
  push:
    branches: [main]
    paths:
      - '**'
      - '!site/**'
      - '!docs/**'
      - '!*.md'
      - 'THIRD-PARTY-NOTICES.md'
      - '!.github/ISSUE_TEMPLATE/**'
      - '!.github/workflows/pages.yml'
      - '!scripts/brand/**'
  workflow_dispatch:

# Actions are pinned by commit (a tag can be moved); Dependabot proposes updates. The Linux image is pinned by digest.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis-linux:
    name: Analysis core (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.2-noble@sha256:eccc7a97f9b9881d9659e2e788081fd7675f86d39793b51200bfb178398b3784
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build vespertine-analyze (release)
        run: swift build -c release --package-path Packages/VespertineAnalysis
      - name: Test
        run: swift test --package-path Packages/VespertineAnalysis

  whitespace:
    name: No whitespace errors (Linux)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # A pull request is checked out as its test merge into main, so the first parent is main and this is the PR's diff.
      - name: No whitespace errors
        run: git diff --check HEAD^1 HEAD

  packages-macos:
    name: Engine, library and real-time C (macOS)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: kit-cache
        with:
          path: Packages/VespertineKit/.build
          key: spm-kit-${{ runner.os }}-${{ hashFiles('Packages/VespertineKit/Package.resolved') }}
          restore-keys: spm-kit-${{ runner.os }}-
      - name: VespertineKit tests (debug)
        run: swift test --package-path Packages/VespertineKit
      - name: VespertineKit tests (release)
        run: swift test --package-path Packages/VespertineKit -c release
      - name: Analysis core tests (macOS, with the app-parity tests)
        run: swift test --package-path Packages/VespertineAnalysis
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.kit-cache.outputs.cache-hit != 'true'
        with:
          path: Packages/VespertineKit/.build
          key: ${{ steps.kit-cache.outputs.cache-primary-key }}
      # The real-time C and script checks used to start a macOS runner of their own for half a minute of work.
      # They still run when a test above failed, as they did in their own job.
      - name: AddressSanitizer + UndefinedBehaviorSanitizer, then ThreadSanitizer
        if: ${{ !cancelled() }}
        run: |
          for sanitizer in address,undefined thread; do
            clang -std=c11 -g -O1 -fsanitize="$sanitizer" -fno-sanitize-recover=all \
              -I Packages/VespertineKit/Sources/CVespertineRT/include \
              tests/rt-audit.c Packages/VespertineKit/Sources/CVespertineRT/vespertine_rt.c \
              -framework CoreAudio -framework AudioToolbox -o "rt-audit-${sanitizer//,/}"
            "./rt-audit-${sanitizer//,/}"
          done
      - name: Static analysis
        if: ${{ !cancelled() }}
        run: |
          clang --analyze -Xclang -analyzer-werror -std=c11 -I Packages/VespertineKit/Sources/CVespertineRT/include \
            Packages/VespertineKit/Sources/CVespertineRT/vespertine_rt.c -o /dev/null
      - name: Release scripts parse
        if: ${{ !cancelled() }}
        run: for s in scripts/*.sh; do zsh -n "$s"; done

  app-macos:
    name: App (macOS)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: xcodebuild -version
      - name: Generate the project
        run: brew install xcodegen && scripts/generate-project.sh
      - name: App and kit lockfiles agree
        run: python3 scripts/check-lockfiles.py
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: app-cache
        with:
          path: build/CI/SourcePackages
          key: spm-app-${{ runner.os }}-${{ hashFiles('project.yml', 'App/Package.resolved') }}
          restore-keys: spm-app-${{ runner.os }}-
      - name: App tests
        run: |
          xcodebuild -project Vespertine.xcodeproj -scheme Vespertine -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build/CI -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO test
      - name: Universal Release build
        run: |
          xcodebuild -project Vespertine.xcodeproj -scheme Vespertine -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build/CI -onlyUsePackageVersionsFromResolvedFile ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
          app=build/CI/Build/Products/Release/Vespertine.app
          # Current lipo verifies one architecture per call (two make it read the second as an input file).
          for arch in arm64 x86_64; do lipo "$app/Contents/MacOS/Vespertine" -verify_arch $arch; done
          test -f "$app/Contents/Resources/LICENSE" && test -f "$app/Contents/Resources/THIRD-PARTY-NOTICES.md"
          test -f "$app/Contents/Resources/Licenses/FFmpeg-LGPL-2.1.txt" && test -f "$app/Contents/Resources/Licenses/SFBAudioEngine-ACKNOWLEDGMENTS.md"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.app-cache.outputs.cache-hit != 'true'
        with:
          path: build/CI/SourcePackages
          key: ${{ steps.app-cache.outputs.cache-primary-key }}

  # Spec-traced verification (verification/README.md). The Linux jobs need nothing paywalled: the registry check
  # recomputes only hashes of Vespertine's own docs and of the pinned oracle sources, never the spec cache.
  verification-registry:
    name: Verification registry and oracles (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml
      - name: Fetch the pinned oracle sources (refuses any that differ from the registry)
        run: python3 verification/tools/fetch_oracles.py
      - name: Requirement registry, claims and hashes
        run: python3 verification/tools/check_registry.py
      - name: DST fixtures against the reference decoder (libdstdec)
        run: python3 verification/oracles/dst/check_fixtures.py
      - name: Loopback tools, on synthetic captures
        run: python3 verification/hardware/selftest.py

  verification-linux:
    name: Spec-traced checks and mutants (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.2-noble@sha256:eccc7a97f9b9881d9659e2e788081fd7675f86d39793b51200bfb178398b3784
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every check against every clean-room implementation, and against Vespertine's real-time C engine and DST
      # decoder (the parts that build on Linux).
      - name: Spec-traced checks
        run: swift test --package-path verification/harness --skip 'mutant\('
      # Fails when a mutant survives: a requirement its checks don't really test.
      - name: Mutant suite
        run: swift test --package-path verification/harness --filter 'mutant\('

  verification-macos:
    name: Spec-traced checks against Vespertine (macOS)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: xcodebuild -version && swift --version
      # The same checks and mutants, plus Vespertine's DoP packer, decoder float path, rate planner and BIT-PERFECT
      # verdict; also writes the IEC 61937 carriers for the oracle job.
      - name: Spec-traced checks, mutants and Vespertine's results
        env:
          VERIFICATION_IEC_OUT: ${{ github.workspace }}/verification-carriers
          VERIFICATION_RESULTS: ${{ github.workspace }}/verification-carriers/results-macos.json
        run: swift test --package-path verification/harness
      - name: Scoreboard
        if: ${{ !cancelled() }}
        run: python3 verification/tools/scoreboard.py verification-carriers/results-macos.json >> "$GITHUB_STEP_SUMMARY"
      - name: Loopback probe compiles
        if: ${{ !cancelled() }}
        run: swiftc -typecheck verification/hardware/probe.swift
      # The repository pins no artifact action, so the carriers reach the Linux job through the cache. Saved even when
      # a check above failed, so the carrier oracles still run.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: verification-carriers
          key: verification-carriers-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

  verification-iec-oracle:
    name: IEC 61937 carriers against FFmpeg and the blind scanner (Linux)
    needs: verification-macos
    if: ${{ !cancelled() && needs.verification-macos.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: verification-carriers
          key: verification-carriers-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: FFmpeg 6.1.1 (the version the oracle record pins)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Carriers against FFmpeg's S/PDIF demuxer and the carrier scanner
        run: python3 verification/oracles/iec61937/check_carriers.py verification-carriers
