# Builds and tests every pull request to main and every push to main:
# - the analysis core on Linux, where vespertine-analyze runs on servers;
# - the engine and library packages on macOS, and in the same job the real-time C under AddressSanitizer,
#   UndefinedBehaviorSanitizer and ThreadSanitizer, clang's analyzer, and a parse of the release scripts;
# - the app itself (generated with XcodeGen) with its tests, plus a universal Release build;
# - the String Catalogs (scripts/check-localizations.py), in the verification registry job;
# - the spec-traced verification (verification/): the requirement registry and oracles, the blind-written checks
#   against their clean-room implementations, mutants and Vespertine, and Vespertine's IEC 61937 carriers against
#   FFmpeg's S/PDIF demuxer and a blind carrier scanner.
# Nothing here signs, notarizes or publishes; tests that need real audio hardware stay opt-in (VESPERTINE_HARDWARE_TESTS).
#
# macOS runner minutes are the expensive ones (about 10x Linux when billed), and an account runs only a few macOS jobs
# at a time, so a run that needs more waits in a queue (the reason PR runs took 30 to 40 minutes). So:
# - each macOS job runs only when the change touches something it reads (scripts/ci-changes.py decides, and runs
#   everything when unsure). Changes only to the website, docs, root Markdown or issue templates run just the Linux
#   jobs, so their required checks still report (a skipped job counts as passed). THIRD-PARTY-NOTICES.md and LICENSE
#   ship inside the app, so they still run everything. A change to app code (App/, Packages/, Driver/, Helper/,
#   RemoteApp/, project.yml, Package.swift and the like) ALWAYS runs both "App (macOS)" and "Engine, library and
#   real-time C (macOS)"; scripts/test-ci-changes.py pins that;
# - "macOS jobs ran when this change needed them (Linux)" is the backstop for the rule above: it fails when a macOS job
#   the change needs was skipped (a draft pull request, a gate that misread a diff) or did not succeed, so a skipped
#   macOS job can only ever mean that nothing it reads changed. Require it next to the macOS jobs;
# - draft pull requests get the Linux jobs only, and that gate check fails on a draft whose change needs macOS, so it
#   can't be merged by accident. The macOS jobs run when the PR is marked ready for review, or on
#   demand (Actions > CI > Run workflow, on the PR's branch);
# - a newer push to the same pull request cancels the run in progress. Pushes to main never cancel each other: each
#   push runs only the jobs its own diff needs, so a cancelled main run would leave its commit's macOS jobs untested.
#   So a push to main gets a concurrency group of its own commit: in one shared group GitHub keeps only one waiting
#   run, and each newer push cancels the waiting one even with cancel-in-progress off (four merges in a row while a
#   long run was going left three of them untested and the README badge red);
# - pull requests restore the SwiftPM caches but only main saves them, so per-PR copies (0.7 to 1.3 GB each) don't
#   push main's out of the repository's 10 GB cache;
# - every job has a timeout of about twice its longest run so far, so a hung test can't hold a runner for an hour;
# - a macOS job runs on GitHub's runner (macos-26) or on the project's own Macs, whichever would finish it first:
#   scripts/ci-pick-runners.py decides for each job, from which Macs are taking jobs right now and what is already
#   waiting where, and says why in the run's summary. A job sent to the project's Macs is taken by whichever of them
#   is free first. A Mac that is off, asleep or unplugged gets nothing, and
#   the job runs on GitHub's runner as before. Pull requests from forks and from bots (Dependabot) never run on the
#   project's Macs: the script sends them to GitHub's runners. A pull request brings its own copy of that script and of
#   this file, though, so what really holds for a fork is that the repository asks for approval before any workflow
#   from an outside contributor runs at all (read its changes to .github/ and scripts/ci-* before approving), and
#   that each Mac refuses such a job itself (scripts/ci-runner-job-gate.sh, set as the runner's job-started hook).
#   Setting the repository variable CI_OWN_MACS to "off", or choosing "github" on a manual run, sends everything to
#   GitHub's runners ("own" on a manual run uses the Macs even then, to try a change to them before switching back on).
#   The project's Macs keep their files between runs, so the steps below leave nothing behind that a later run reads:
#   the checkout is cleaned, the app's tests get a bundle identifier and data directory of their own.
#   Those Macs are in use (one may be playing music, another carrying a call), so no test there can talk to macOS's
#   audio system: the runner starts `swift test` in a sandbox that can't, and tells the tests so
#   (VESPERTINE_CI_NO_AUDIO=1); told the same, the debug app that hosts the app's tests shuts itself off first thing
#   (CIQuiet). The tests then see no audio devices at all, whatever they try: one that needs a device to exist says so
#   and is skipped there (GitHub's runners have one), and one test in the kit and one in the app fail if they can see
#   a device after all.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      macs:
        description: Where the macOS jobs run (auto picks the project's Macs or GitHub's runners, whichever is quicker; own is the project's Macs even while CI_OWN_MACS is off)
        type: choice
        options: [auto, github, own]
        default: auto

# Actions are pinned by commit (a tag can be moved); Dependabot proposes updates. The Linux image is pinned by digest.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Which macOS jobs this change needs (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the picker reads the repository's queued and running jobs
    outputs:
      packages: ${{ steps.changes.outputs.packages }}
      app: ${{ steps.changes.outputs.app }}
      verification: ${{ steps.changes.outputs.verification }}
      packages_runner: ${{ steps.runners.outputs.packages_runner }}
      app_runner: ${{ steps.runners.outputs.app_runner }}
      verification_runner: ${{ steps.runners.outputs.verification_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        run: python3 scripts/ci-changes.py | tee -a "$GITHUB_OUTPUT"
      # Where each macOS job runs. If this step fails or prints nothing, the jobs fall back to macos-26 below.
      - id: runners
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEED_PACKAGES: ${{ steps.changes.outputs.packages }}
          NEED_APP: ${{ steps.changes.outputs.app }}
          NEED_VERIFICATION: ${{ steps.changes.outputs.verification }}
          CI_OWN_MACS: ${{ vars.CI_OWN_MACS }}
          CI_MACS_INPUT: ${{ inputs.macs }}
          CI_MAC_FAST_SEEN: ${{ vars.CI_MAC_FAST_SEEN }}
          CI_MAC_SHARED_SEEN: ${{ vars.CI_MAC_SHARED_SEEN }}
        run: python3 scripts/ci-pick-runners.py | tee -a "$GITHUB_OUTPUT"

  analysis-linux:
    name: Analysis core (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.2-noble@sha256:eccc7a97f9b9881d9659e2e788081fd7675f86d39793b51200bfb178398b3784
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build vespertine-analyze (release)
        run: swift build -c release --package-path Packages/VespertineAnalysis
      - name: Test
        run: swift test --package-path Packages/VespertineAnalysis

  remote-protocol-linux:
    name: Remote protocol (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: swift:6.2-noble@sha256:eccc7a97f9b9881d9659e2e788081fd7675f86d39793b51200bfb178398b3784
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The message format and pairing links; the TLS and pairing-key tests need Apple's frameworks and run on macOS.
      - name: Test
        run: swift test --package-path Packages/VespertineRemoteKit

  whitespace:
    name: No whitespace errors (Linux)
    # On a push to main too (the squashed commit against its parent): skipped there, main's commits showed one check short
    # of the pull request's (13 of 14).
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # A pull request is checked out as its test merge into main, so the first parent is main and this is the PR's diff.
      # A push to main is one squashed commit: its first parent is main before it.
      - name: No whitespace errors
        run: git diff --check HEAD^1 HEAD

  packages-macos:
    name: Engine, library and real-time C (macOS)
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.outputs.packages != 'false' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ${{ fromJSON(needs.changes.outputs.packages_runner || '"macos-26"') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: xcodebuild -version && swift --version
      # GitHub's runners only: the cached build folder holds the paths of the runner that made it, so one of the
      # project's Macs can't use it (and must not save one for GitHub's runners to restore).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: kit-cache
        if: runner.environment == 'github-hosted'
        with:
          path: Packages/VespertineKit/.build
          key: spm-kit-${{ runner.os }}-${{ hashFiles('Packages/VespertineKit/Package.resolved') }}
          restore-keys: spm-kit-${{ runner.os }}-
      # Release only: it is what ships, the kit has no debug-only checks (no assert, no #if DEBUG), and a second, debug
      # build of the kit and its C dependencies cost 4 to 10 minutes of macOS time. The App job still builds it in Debug.
      # The build runs outside the watchdog (a cold release build can take 15 minutes on a slow runner and must not eat the
      # test budget); a test hang prints the test process's stacks after 15 minutes instead of waiting out the job.
      # -enable-testing is what swift test adds by itself for the tests' @testable imports; swift build does not.
      # CI_BUILD_JOBS is set only by a runner that must leave room for other work: it caps the compile jobs.
      - name: Build VespertineKit and its tests (release)
        run: swift build --package-path Packages/VespertineKit --build-tests -c release -Xswiftc -enable-testing ${CI_BUILD_JOBS:+-j $CI_BUILD_JOBS}
      - name: VespertineKit tests (release)
        run: scripts/run-with-watchdog.sh 900 swift test --package-path Packages/VespertineKit -c release --skip-build --skip VespertineUPnPTests --skip VespertineAirPlayTests
      # The network player and AirPlay tests play to a fake renderer and a fake receiver over the loopback, against the
      # deadlines the app really uses (a player that doesn't start, a receiver that goes quiet). Among the kit's other
      # 1,900 tests every test waits tens of seconds for a thread on a three-core runner, which those deadlines would
      # take for a dead device, so they run on their own.
      - name: Network player and AirPlay tests (release)
        run: scripts/run-with-watchdog.sh 600 swift test --package-path Packages/VespertineKit -c release --skip-build --filter 'VespertineUPnPTests|VespertineAirPlayTests'
      - name: Analysis core tests (macOS, with the app-parity tests)
        run: swift test --package-path Packages/VespertineAnalysis
      # The phone remote's protocol, with its TLS pre-shared-key WebSocket tested end to end on the loopback, and the
      # phone's player, shares and stream server.
      # Built outside the watchdog, as the kit is: build and tests together had come within 20 s of its 300 s.
      - name: Build the remote protocol tests
        run: swift build --package-path Packages/VespertineRemoteKit --build-tests ${CI_BUILD_JOBS:+-j $CI_BUILD_JOBS}
      # One test target at a time, each in a process of its own. Run together on a three-core runner, the DSD tests of
      # the share target (minutes of arithmetic each in a debug build) held every thread the tests share for 30 to 55
      # seconds, and the tests that talk over the loopback in the other targets ran out of their own five-second waits
      # with nothing wrong (#421 and #429 on main). The targets are read from the folder, so a new one is run too.
      - name: Remote protocol tests (macOS)
        run: |
          status=0
          for dir in Packages/VespertineRemoteKit/Tests/*/; do
            target=$(basename "$dir")
            echo "::group::$target"
            scripts/run-with-watchdog.sh 300 swift test --package-path Packages/VespertineRemoteKit --skip-build --filter "$target" || status=1
            echo "::endgroup::"
          done
          exit $status
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' && steps.kit-cache.outputs.cache-hit != 'true'
        with:
          path: Packages/VespertineKit/.build
          key: ${{ steps.kit-cache.outputs.cache-primary-key }}
      # The real-time C and script checks used to start a macOS runner of their own for half a minute of work.
      # They still run when a test above failed, as they did in their own job.
      - name: AddressSanitizer + UndefinedBehaviorSanitizer, then ThreadSanitizer
        if: ${{ !cancelled() }}
        run: |
          for sanitizer in address,undefined thread; do
            clang -std=c11 -g -O1 -fsanitize="$sanitizer" -fno-sanitize-recover=all \
              -I Packages/VespertineKit/Sources/CVespertineRT/include \
              tests/rt-audit.c Packages/VespertineKit/Sources/CVespertineRT/vespertine_rt.c \
              -framework CoreAudio -framework AudioToolbox -o "rt-audit-${sanitizer//,/}"
            "./rt-audit-${sanitizer//,/}"
          done
      - name: Static analysis
        if: ${{ !cancelled() }}
        run: |
          clang --analyze -Xclang -analyzer-werror -std=c11 -I Packages/VespertineKit/Sources/CVespertineRT/include \
            Packages/VespertineKit/Sources/CVespertineRT/vespertine_rt.c -o /dev/null
      # Mac Sound Output (beta): the audio driver's ring and layout helpers under the sanitizers, and the driver itself
      # compiled with every warning as an error and through the static analyzer (it runs inside coreaudiod).
      - name: Sound driver checks
        if: ${{ !cancelled() }}
        run: |
          for sanitizer in address,undefined thread; do
            clang -std=c11 -g -O1 -fsanitize="$sanitizer" -fno-sanitize-recover=all -I Driver/VespertineSound \
              tests/sound-driver-audit.c -o "sound-driver-audit-${sanitizer//,/}"
            "./sound-driver-audit-${sanitizer//,/}"
          done
          clang -std=c11 -Wall -Wextra -Wenum-float-conversion -Werror -c Driver/VespertineSound/VespertineSound.c -o /dev/null
          clang --analyze -Xclang -analyzer-werror -std=c11 Driver/VespertineSound/VespertineSound.c -o /dev/null
      - name: Release scripts parse
        if: ${{ !cancelled() }}
        run: for s in scripts/*.sh; do zsh -n "$s"; done

  app-macos:
    name: App (macOS)
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.outputs.app != 'false' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ${{ fromJSON(needs.changes.outputs.app_runner || '"macos-26"') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: xcodebuild -version
      - name: Generate the project
        run: (command -v xcodegen >/dev/null || brew install xcodegen) && scripts/generate-project.sh
      - name: App and kit lockfiles agree
        run: python3 scripts/check-lockfiles.py
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: app-cache
        if: runner.environment == 'github-hosted'
        with:
          path: build/CI/SourcePackages
          key: spm-app-${{ runner.os }}-${{ hashFiles('project.yml', 'App/Package.resolved') }}
          restore-keys: spm-app-${{ runner.os }}-
      # The tests run inside the app. On a Mac that someone also uses, the app must not read that person's settings
      # (their saved output device above all) or a library a previous run left: so it gets a bundle identifier of its
      # own, whose settings are deleted first, and the scheme's test library (-VespertineDataDirectory) starts empty.
      - name: App tests
        run: |
          # The build log runs past what the log viewer keeps, so a failure repeats the compiler's errors at the end.
          set -o pipefail
          mkdir -p build
          rm -rf /tmp/vespertine-test-host-library
          defaults delete org.szeremeta.Vespertine.ci 2>/dev/null || true
          # Xcode inserts the library that loads the tests into the app. A runner that sets this replaces Xcode's list,
          # and the app then starts with no tests in it ("The test runner hung before establishing connection").
          unset TEST_RUNNER_DYLD_INSERT_LIBRARIES
          xcodebuild -project Vespertine.xcodeproj -scheme Vespertine -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build/CI -onlyUsePackageVersionsFromResolvedFile ${CI_BUILD_JOBS:+-jobs $CI_BUILD_JOBS} \
            CODE_SIGNING_ALLOWED=NO PRODUCT_BUNDLE_IDENTIFIER=org.szeremeta.Vespertine.ci test 2>&1 | tee build/app-tests.log \
            || { echo "::group::Errors"; grep -E ': error: |While evaluating request|While emitting' build/app-tests.log | sort -u; echo "::endgroup::"; exit 1; }
      - name: Universal Release build
        run: |
          xcodebuild -project Vespertine.xcodeproj -scheme Vespertine -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build/CI -onlyUsePackageVersionsFromResolvedFile ${CI_BUILD_JOBS:+-jobs $CI_BUILD_JOBS} \
            ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
          app=build/CI/Build/Products/Release/Vespertine.app
          # Current lipo verifies one architecture per call (two make it read the second as an input file).
          for arch in arm64 x86_64; do lipo "$app/Contents/MacOS/Vespertine" -verify_arch $arch; done
          test -f "$app/Contents/Resources/LICENSE" && test -f "$app/Contents/Resources/THIRD-PARTY-NOTICES.md"
          test -f "$app/Contents/Resources/Licenses/FFmpeg-LGPL-2.1.txt" && test -f "$app/Contents/Resources/Licenses/SFBAudioEngine-ACKNOWLEDGMENTS.md"
      - name: iPhone and iPad remote builds
        run: |
          set -o pipefail
          xcodegen generate --spec RemoteApp/project.yml
          xcodebuild -project RemoteApp/VespertineRemote.xcodeproj -scheme VespertineRemote -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/CI-iOS ${CI_BUILD_JOBS:+-jobs $CI_BUILD_JOBS} \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/remote-ios.log \
            || { echo "::group::Errors"; grep -E ': error: |While evaluating request|While emitting' build/remote-ios.log | sort -u; echo "::endgroup::"; exit 1; }
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' && steps.app-cache.outputs.cache-hit != 'true'
        with:
          path: build/CI/SourcePackages
          key: ${{ steps.app-cache.outputs.cache-primary-key }}

  # Spec-traced verification (verification/README.md). The Linux jobs need nothing paywalled: the registry check
  # recomputes only hashes of Vespertine's own docs and of the pinned oracle sources, never the spec cache.
  verification-registry:
    name: Verification registry and oracles (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PyYAML comes with GitHub's Ubuntu image, so nothing is downloaded here. Only an image without it installs it,
      # and says what it is doing: a quiet apt-get that stalls on a mirror shows nothing until the job's time is up.
      - name: Tools
        run: python3 -c 'import yaml' || { sudo apt-get update && sudo apt-get install -y python3-yaml; }
      - name: Fetch the pinned oracle sources (refuses any that differ from the registry)
        run: python3 verification/tools/fetch_oracles.py
      - name: Requirement registry, claims and hashes
        run: python3 verification/tools/check_registry.py
      - name: DST fixtures against the reference decoder (libdstdec)
        run: python3 verification/oracles/dst/check_fixtures.py
      - name: Loopback tools, on synthetic captures
        run: python3 verification/hardware/selftest.py
      - name: Studio evidence tools (parsers, signal-path checks, MEASURED/UNVERIFIED report)
        run: python3 verification/studio/test_evidence.py
      # Not verification either: the macOS-job gate's own tests (every app-code path must run App and Engine).
      - name: macOS job gate tests
        if: ${{ !cancelled() }}
        run: python3 scripts/test-ci-changes.py
      # Nor this: where the macOS jobs run (a fork never reaches the project's Macs; a quiet Mac gets nothing).
      - name: macOS runner choice tests
        if: ${{ !cancelled() }}
        run: python3 scripts/test-ci-pick-runners.py
      # Not verification, but a Linux job every change runs (no path filter), so a catalog or Swift string change
      # can't skip it: every string translated, placeholders matching, every localized literal in the catalog.
      - name: String Catalogs complete
        if: ${{ !cancelled() }}
        run: python3 scripts/check-localizations.py

  verification-linux:
    name: Spec-traced checks and mutants (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.2-noble@sha256:eccc7a97f9b9881d9659e2e788081fd7675f86d39793b51200bfb178398b3784
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every check against every clean-room implementation, and against Vespertine's real-time C engine and DST
      # decoder (the parts that build on Linux).
      - name: Spec-traced checks
        run: swift test --package-path verification/harness --skip 'mutant\('
      # Fails when a mutant survives: a requirement its checks don't really test.
      - name: Mutant suite
        run: swift test --package-path verification/harness --filter 'mutant\('

  verification-macos:
    name: Spec-traced checks against Vespertine (macOS)
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.outputs.verification != 'false' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ${{ fromJSON(needs.changes.outputs.verification_runner || '"macos-26"') }}
    timeout-minutes: 60
    env:
      VERIFICATION_IEC_OUT: ${{ github.workspace }}/verification-carriers
      VERIFICATION_RESULTS: ${{ github.workspace }}/verification-carriers/results-macos.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: xcodebuild -version && swift --version
      # The same checks and mutants as on Linux, plus Vespertine's DoP packer, decoder float path, rate planner and
      # BIT-PERFECT verdict. Release: the checks run millions of cases, which a debug build is too slow for on this
      # runner (on Linux the results are identical in both); `swift test` keeps testable imports on for the verdict
      # adapter. One step per group, so a slow or stuck group is named in the log; the first one builds.
      - name: Build, then DoP packing
        timeout-minutes: 20
        run: swift test -c release --package-path verification/harness --filter DoPPackAcceptance ${CI_BUILD_JOBS:+-j $CI_BUILD_JOBS}
      - name: DoP output stream
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: swift test -c release --skip-build --package-path verification/harness --filter DoPStreamAcceptance
      - name: Float output
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: swift test -c release --skip-build --package-path verification/harness --filter FloatAcceptance
      - name: Integer output
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: swift test -c release --skip-build --package-path verification/harness --filter IntegerAcceptance
      - name: Rate planning
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: swift test -c release --skip-build --package-path verification/harness --filter RateAcceptance
      - name: BIT-PERFECT verdict
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: swift test -c release --skip-build --package-path verification/harness --filter VerdictAcceptance
      - name: DST decoding
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: swift test -c release --skip-build --package-path verification/harness --filter DSTAcceptance
      # Also writes the IEC 61937 carriers for the oracle job.
      - name: Adapters and IEC 61937 carriers
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: swift test -c release --skip-build --package-path verification/harness --filter 'AdapterSmokeTests|writeIECCarriers|dumpSACDImage'
      - name: Scoreboard
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          set -o pipefail
          status=0
          swift test -c release --skip-build --package-path verification/harness --filter 'scoreboard\(\)' || status=$?
          python3 verification/tools/scoreboard.py "$VERIFICATION_RESULTS" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Loopback probe compiles
        if: ${{ !cancelled() }}
        run: swiftc -typecheck verification/hardware/probe.swift
      # The repository pins no artifact action, so the carriers reach the Linux job through the cache. Saved even when
      # a check above failed, so the carrier oracles still run.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: verification-carriers
          key: verification-carriers-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

  verification-iec-oracle:
    name: IEC 61937 carriers against FFmpeg and the blind scanner (Linux)
    needs: verification-macos
    if: ${{ !cancelled() && needs.verification-macos.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: verification-carriers
          key: verification-carriers-${{ github.run_id }}-${{ github.run_attempt }}
          # A re-run of only the failed jobs does not run the macOS job again when it passed, so this attempt has no
          # cache of its own: the newest one an earlier attempt of this run saved is the same commit's carriers.
          restore-keys: verification-carriers-${{ github.run_id }}-
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      # Built from FFmpeg's own source at the tag the oracle record reviewed (the script refuses any other commit), in
      # about half a minute. Not installed with apt-get: on some of GitHub's runners that install (a hundred packages
      # from a mirror) never finished, the job ran out of time and main went red with nothing wrong in the commit.
      - name: FFmpeg 6.1.1 (built from the source the oracle record pins)
        timeout-minutes: 5
        run: |
          verification/oracles/iec61937/build_ffmpeg.sh "$RUNNER_TEMP/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
      - name: Carriers against FFmpeg's S/PDIF demuxer and the carrier scanner
        run: python3 verification/oracles/iec61937/check_carriers.py verification-carriers

  # The backstop for the path filter. Runs always (even when a job it watches failed, was skipped or was cancelled)
  # and fails unless every macOS job this change needs succeeded. A skipped macOS job is accepted only when the
  # filter says the change doesn't touch what it reads. On a draft pull request the macOS jobs are skipped by design,
  # so this check is red there until the PR is marked ready for review and the macOS jobs have run.
  macos-gate:
    name: macOS jobs ran when this change needed them (Linux)
    needs: [changes, packages-macos, app-macos, verification-macos]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Every needed macOS job ran and passed
        run: |
          fail=0
          result() { jq -r --arg j "$1" '.[$j].result' <<<"$NEEDS"; }
          if [ "$(result changes)" != success ]; then
            echo "::error::The path filter itself did not succeed ($(result changes)): treat every macOS job as needed."
            fail=1
          fi
          for pair in packages-macos:packages app-macos:app verification-macos:verification; do
            job=${pair%%:*}; out=${pair##*:}
            res=$(result "$job"); need=$(jq -r --arg o "$out" '.changes.outputs[$o] // "true"' <<<"$NEEDS")
            echo "$job: result=$res, needed=$need"
            if [ "$res" = success ]; then continue; fi
            if [ "$res" = skipped ] && [ "$need" = false ]; then continue; fi
            echo "::error::$job is $res but this change needs it (needed=$need). Mark the pull request ready for review, or run CI from Actions on its branch."
            fail=1
          done
          exit $fail
