# Publishes site/ to GitHub Pages whenever it changes on main.
name: Website

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Browsers cache style.css for 10 minutes; naming it by its content makes new pages arrive with their styles.
      - name: Version the stylesheet
        run: |
          v=$(sha256sum site/style.css | cut -c1-10)
          sed -i "s/style\.css?v=[A-Za-z0-9]*/style.css?v=$v/" site/*.html
          grep -c "style.css?v=$v" site/*.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
