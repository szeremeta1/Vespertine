# Publishes site/ to GitHub Pages whenever it changes on main.
name: Website

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # A deployment cut off halfway can leave the site half-published.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only the deploying job can write to Pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Browsers cache style.css for 10 minutes; naming it by its content makes new pages arrive with their styles.
      - name: Version the stylesheet
        run: |
          v=$(sha256sum site/style.css | cut -c1-10)
          sed -i "s/style\.css?v=[A-Za-z0-9]*/style.css?v=$v/" site/*.html
          grep -c "style.css?v=$v" site/*.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
