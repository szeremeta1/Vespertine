# Runs a CI run's failed jobs once more when a job failed only because its runner went away under it.
#
# The project's own Macs take CI jobs, and one of them is a laptop: its runner is stopped the moment the lid closes or
# the charger comes out. GitHub does not hand a job whose runner stopped to another runner; it marks the job failed
# ("The runner has received a shutdown signal", or "lost communication with the server" when the machine just went),
# and on main that is a red commit and a red badge with nothing wrong in the code.
#
# So when a CI run ends in failure, this looks at its failed jobs: the annotations, and for a job that was cut off,
# its log, where the runner says why. If one of them carries either message, the run's failed jobs (and the jobs that
# needed them) are run again. The jobs keep the runner labels the first attempt chose, and the Macs share one label,
# so the other Mac takes them.
#
# Once per run only: a second attempt that fails stays failed, whatever the reason. A run with no such job is
# left alone, so a real test failure is never retried. Nothing from the run is checked out or executed here.
name: CI, again when a runner went away

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  rerun:
    name: Run the failed jobs again if a runner went away
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write   # to read the failed jobs' logs and run them again
      checks: read     # to read the failed jobs' annotations
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN: ${{ github.event.workflow_run.id }}
    steps:
      - name: Look for a job whose runner went away, and run the failed jobs again
        run: |
          set -euo pipefail
          gone=0
          while read -r job; do
            [ -n "$job" ] || continue
            # Such a job is annotated only "The operation was canceled."; what stopped it is said in its log.
            gh api "repos/$REPO/check-runs/$job/annotations" --paginate --jq '.[].message' > annotations.txt
            if grep -q 'lost communication with the server' annotations.txt; then
              echo "job $job: its runner went away (lost communication)"
              gone=1
              continue
            fi
            grep -q 'The operation was canceled' annotations.txt || continue
            # With curl: gh refuses to print a log that holds terminal colour codes, and every job log does.
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/jobs/$job/logs" -o job.log || continue
            if grep -q '##\[error\]The runner has received a shutdown signal' job.log; then
              echo "job $job: its runner went away (shutdown signal)"
              gone=1
            fi
          done < <(gh api "repos/$REPO/actions/runs/$RUN/attempts/1/jobs?per_page=100" --paginate \
                     --jq '.jobs[] | select(.conclusion == "failure") | .id')
          if [ "$gone" = 1 ]; then
            gh api -X POST "repos/$REPO/actions/runs/$RUN/rerun-failed-jobs"
            echo "Run $RUN: failed jobs started again."
          else
            echo "Run $RUN: no job lost its runner. Left as it is."
          fi
