# CodeQL for Swift (see codeql.yml for why it is separate): on a pull request that changes Swift, once a week on main,
# and on demand. Same autobuild as GitHub's default setup used.
name: CodeQL (Swift)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['**/*.swift', '**/Package.swift', '**/Package.resolved', 'project.yml']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-swift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (swift)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift
          build-mode: autobuild
      - uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:swift
