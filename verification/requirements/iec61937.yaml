# Receiver bitstream (IEC 61937). The burst format is defined only in IEC 61937-1, -2, -3 and -5, which are paywalled
# and were not bought (decision 2026-10-09: oracle only). Clause numbers below are from the table of contents in IEC's
# free preview of each part (spec-cache previews, SHA-256 in SOURCES.md); the clause text itself was not seen.
# The oracle checks are described in hardware/IEC61937-ORACLE.md.

- id: IEC-001
  claim: CLAIMS.md#iec-ac3-burst
  source:
    doc: "IEC 61937-1:2021 Digital audio: Interface for non-linear PCM encoded audio bitstreams applying IEC 60958, Part 1: General"
    version: "Edition 3.0 (2021-02-24)"
    section: "§6.1 Coding of the bitstream; Figure 3 Burst-preamble; Table 3 Burst-preamble words; Table 4 Bit map of burst-preambles"
    url: "https://webstore.iec.ch/en/publication/62828"
    availability: paywalled
  requirement: "Each data-burst starts with the burst-preamble words this clause defines; Vespertine's preamble must match them."
  quote_sha256: BLOCKED
  status: blocked-on-source
  kind: spec
  testable: false
  gap: "Not bought (CHF 160)."
  interface: "Vespertine's IEC61937.burst (no clean-room contract until the text is in hand)"

