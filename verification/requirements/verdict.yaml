# The BIT-PERFECT verdict. Contract: contracts/bit-perfect-verdict.md
# Every record here is Vespertine's own definition (vespertine-rule), cited from its docs. The Core Audio header records
# say what the readback values mean.

- id: BPV-001
  claim: CLAIMS.md#bp-pcm-native-rate
  source:
    doc: "Vespertine docs/VERIFICATION.md"
    version: "98cad1a"
    section: "line 20"
    availability: repository
    cache: { repo: docs/VERIFICATION.md, lines: 20, from: "The source is PCM", to: "no DSD is converted to PCM." }
  requirement: "In PCM mode the badge is not BIT-PERFECT when the source is lossy or DSD, when the rate is converted, or when DSD is converted to PCM."
  quote_sha256: 9545e217afe30d0fa3a30b91af876701d1bcaa4e07d3888950120a5765a02cf9
  kind: vespertine-rule
  testable: true
  gap: "ARCHITECTURE.md line 90 says the source must be lossless; the contract's `pcm` encoding means lossless PCM."
  interface: "contracts/bit-perfect-verdict.md"

- id: BPV-002
  claim: CLAIMS.md#bp-readback
  source:
    doc: "Vespertine docs/VERIFICATION.md"
    version: "98cad1a"
    section: "line 21"
    availability: repository
    cache: { repo: docs/VERIFICATION.md, lines: 21, from: "The device runs at that rate.", to: "It doesn't trust its own request." }
  requirement: "In PCM mode the badge is not BIT-PERFECT unless the nominal rate read back from the device equals the source's sample rate. The requested rate doesn't count."
  quote_sha256: b4f36fae4d657aa460c95942c33c1e5cbb39c2d4805dc5c453e62e85e9836dc4
  kind: vespertine-rule
  testable: true
  gap: "The docs don't give a tolerance. The contract treats rates within 0.5 Hz as equal; tests should use rates that clearly differ."
  interface: "contracts/bit-perfect-verdict.md"

- id: BPV-003
  claim: CLAIMS.md#bp-readback
  source:
    doc: "Vespertine docs/VERIFICATION.md"
    version: "98cad1a"
    section: "line 21"
    availability: repository
    cache: { repo: docs/VERIFICATION.md, lines: 21, from: "The device runs at that rate.", to: "It doesn't trust its own request." }
  requirement: "When the nominal rate or the physical format could not be read back, the badge is not BIT-PERFECT, NATIVE DSD · DoP or BITSTREAM: an unconfirmed format is not trusted."
  quote_sha256: b4f36fae4d657aa460c95942c33c1e5cbb39c2d4805dc5c453e62e85e9836dc4
  kind: vespertine-rule
  testable: true
  gap: "The docs say the app doesn't trust its own request; they don't describe a failed readback. This record reads the sentence as covering it."
  interface: "contracts/bit-perfect-verdict.md"

